<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>候補 B：ティール #0e6b66</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0e6b66}a:hover{color:#0a4f4b}
.btn{font:inherit;font-size:13px;border-radius:6px;padding:0 14px;min-height:36px;cursor:pointer}
.btn-primary{background:#0e6b66;color:#fff;border:1px solid #0e6b66;font-weight:500}
.btn-ghost{background:#fff;color:#1f1f1f;border:1px solid #cfcbc4}
.icon-btn{font:inherit;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #cfcbc4;border-radius:6px;background:#fff;cursor:pointer;padding:0}
.seg{display:flex;border:1px solid #cfcbc4;border-radius:6px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;min-height:34px;border:0;background:#fff;color:#1f1f1f;cursor:pointer}
.seg button[aria-pressed="true"]{background:#0e6b66;color:#fff}
.label{font-size:13px;font-weight:500;color:#1f1f1f}
.hint{font-size:12px;color:#5c5a56}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:#5c5a56}
</style>
</helmet>
<div style="min-height: 800px; display: flex; flex-direction: column; background: #f4f3f0; color: #1f1f1f; font-family: 'Noto Sans JP', system-ui, sans-serif">
  <header style="height: 48px; display: flex; align-items: center; gap: 24px; padding: 0 16px; background: #ffffff; border-bottom: 1px solid #dcd9d3">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0e6b66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
      PDF Converter
    </div>
    <nav style="display: flex; align-self: stretch" aria-label="変換の種類">
      <a href="#" aria-current="page" style="display: flex; align-items: center; padding: 0 16px; font-size: 14px; font-weight: 500; color: #1f1f1f; text-decoration: none; border-bottom: 2px solid #0e6b66">画像 → PDF</a>
      <a href="PdfSingle.dc.html" style="display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #5c5a56; text-decoration: none">PDF → 画像</a>
    </nav>
    <div style="margin-left: auto; display: flex; gap: 8px; align-items: center">
      <label class="hint" for="lang">言語</label>
      <select id="lang" style="font: inherit; font-size: 13px; min-height: 32px; border: 1px solid #cfcbc4; border-radius: 6px; padding: 0 8px; background: #fff"><option>日本語</option><option>English</option></select>
      <button class="btn btn-ghost" aria-label="このアプリについて" style="width: 36px; padding: 0">i</button>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; min-height: 0">
    <aside style="flex: 1 1 280px; max-width: 300px; background: #ffffff; border-right: 1px solid #dcd9d3; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="label">出力</span>
        <div class="seg" role="group" aria-label="出力">
          <button aria-pressed="true">1 つの PDF</button>
          <button aria-pressed="false">1 枚ずつ</button>
        </div>
        <span class="hint">並べた順に 1 ページずつ入れて、1 つの PDF にします</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="label">ページの大きさ</span>
        <div class="seg" role="group" aria-label="ページの大きさ">
          <button aria-pressed="false">画像に合わせる</button>
          <button aria-pressed="true">A4</button>
        </div>
        <span class="hint">A4 の縦か横（画像の向きに合わせる）に、余白を付けて収めます</span>
      </div>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px; box-sizing: border-box">
      <div style="display: flex; align-items: center; gap: 8px">
        <span class="label">画像 3 枚</span>
        <span class="hint">ドラッグか ↑↓ ボタンで並べ替えられます</span>
        <div style="margin-left: auto; display: flex; gap: 8px">
          <button class="btn btn-ghost">画像を追加</button>
          <button class="btn btn-ghost">フォルダを追加</button>
          <button class="btn btn-ghost">すべて外す</button>
        </div>
      </div>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{ items }}" as="item" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #ffffff; border: 1px solid #dcd9d3; border-radius: 8px">
            <span style="width: 20px; text-align: right" class="mono">{{ item.no }}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a867e" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="6" r="1"></circle><circle cx="15" cy="6" r="1"></circle><circle cx="9" cy="12" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="9" cy="18" r="1"></circle><circle cx="15" cy="18" r="1"></circle></svg>
            <div style="width: 56px; height: 56px; border-radius: 4px; background: {{ item.thumb }}; flex: none" role="img" aria-label="{{ item.name }} のサムネイル"></div>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 14px; font-weight: 500">{{ item.name }}</span>
              <span class="mono">{{ item.meta }}</span>
            </div>
            <div style="margin-left: auto; display: flex; gap: 4px">
              <button class="icon-btn" aria-label="上へ"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
              <button class="icon-btn" aria-label="下へ"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"></path></svg></button>
              <button class="icon-btn" aria-label="一覧から外す"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
            </div>
          </li>
        </sc-for>
      </ol>
    </main>
  </div>

  <footer style="height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #ffffff; border-top: 1px solid #dcd9d3">
    <span class="hint">3 ページの PDF になります</span>
    <button class="btn btn-primary" style="margin-left: auto">PDF を保存</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { no: 1, name: 'receipt-0412.jpg', meta: '2480 × 3508 · JPEG · 1.2 MB', thumb: '#d9d4c7' },
        { no: 2, name: 'receipt-0413.jpg', meta: '2480 × 3508 · JPEG · 1.1 MB', thumb: '#cfd8d2' },
        { no: 3, name: 'diagram.png', meta: '1600 × 900 · PNG · 240 KB', thumb: '#c9d6ea' }
      ]
    };
  }
}
</script>
</body>
</html>
