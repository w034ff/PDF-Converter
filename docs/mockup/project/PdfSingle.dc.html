<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PDF から画像：ページの範囲を指定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1e5aa8}a:hover{color:#163f78}
.btn{font:inherit;font-size:13px;border-radius:6px;padding:0 14px;min-height:36px;cursor:pointer}
.btn-primary{background:#1e5aa8;color:#fff;border:1px solid #1e5aa8;font-weight:500}
.btn-ghost{background:#fff;color:#1f1f1f;border:1px solid #cfcbc4}
.seg{display:flex;border:1px solid #cfcbc4;border-radius:6px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;min-height:34px;border:0;background:#fff;color:#1f1f1f;cursor:pointer}
.seg button[aria-pressed="true"]{background:#1e5aa8;color:#fff}
.label{font-size:13px;font-weight:500;color:#1f1f1f}
.hint{font-size:12px;color:#5c5a56}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:#5c5a56}
.field{font:inherit;font-size:13px;min-height:34px;border:1px solid #cfcbc4;border-radius:6px;padding:0 10px;background:#fff;box-sizing:border-box}
</style>
</helmet>
<div style="min-height: 800px; display: flex; flex-direction: column; background: #f4f3f0; color: #1f1f1f; font-family: 'Noto Sans JP', system-ui, sans-serif">
  <header style="height: 48px; display: flex; align-items: center; gap: 24px; padding: 0 16px; background: #ffffff; border-bottom: 1px solid #dcd9d3">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e5aa8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
      PDF Converter
    </div>
    <nav style="display: flex; align-self: stretch" aria-label="変換の種類">
      <a href="ImagesMerge.dc.html" style="display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #5c5a56; text-decoration: none">画像 → PDF</a>
      <a href="#" aria-current="page" style="display: flex; align-items: center; padding: 0 16px; font-size: 14px; font-weight: 500; color: #1f1f1f; text-decoration: none; border-bottom: 2px solid #1e5aa8">PDF → 画像</a>
    </nav>
    <div style="margin-left: auto; display: flex; gap: 8px; align-items: center">
      <label class="hint" for="lang">言語</label>
      <select id="lang" style="font: inherit; font-size: 13px; min-height: 32px; border: 1px solid #cfcbc4; border-radius: 6px; padding: 0 8px; background: #fff"><option>日本語</option><option>English</option></select>
      <button class="btn btn-ghost" aria-label="このアプリについて" style="width: 36px; padding: 0">i</button>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; min-height: 0">
    <aside style="flex: 1 1 280px; max-width: 300px; background: #ffffff; border-right: 1px solid #dcd9d3; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="label">ページ</span>
        <div class="seg" role="group" aria-label="ページ">
          <button aria-pressed="false">すべて</button>
          <button aria-pressed="true">範囲を指定</button>
        </div>
        <label class="hint" for="range">変換するページ（例：1-3, 5）</label>
        <input id="range" class="field" value="1-3, 6">
        <span class="hint">4 ページを変換します</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="label">形式</span>
        <div class="seg" role="group" aria-label="形式">
          <button aria-pressed="true">PNG</button>
          <button aria-pressed="false">JPEG</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label class="label" for="dpi">解像度</label>
        <select id="dpi" class="field">
          <option>72 dpi（画面で見る）</option>
          <option selected>150 dpi（標準）</option>
          <option>300 dpi（印刷する）</option>
        </select>
        <span class="mono">A4 の 1 ページ → 1240 × 1754 px</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="label">保存先フォルダ</span>
        <span class="mono" style="word-break: break-all">C:\Users\owner\Documents\report-images</span>
        <button class="btn btn-ghost" style="align-self: flex-start">フォルダを選ぶ</button>
      </div>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px; box-sizing: border-box">
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
        <span style="font-size: 14px; font-weight: 500">annual-report.pdf</span>
        <span class="mono">8 ページ · A4 · 2.4 MB</span>
        <div style="margin-left: auto; display: flex; gap: 8px">
          <button class="btn btn-ghost">PDF を追加</button>
          <button class="btn btn-ghost">フォルダを追加</button>
          <button class="btn btn-ghost">すべて外す</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{ pages }}" as="page" hint-placeholder-count="8">
          <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: {{ page.opacity }}">
            <div style="width: 100%; aspect-ratio: 210 / 297; background: #ffffff; border: {{ page.border }}; border-radius: 4px; box-sizing: border-box; padding: 14% 12%; display: flex; flex-direction: column; gap: 6px">
              <div style="height: 8px; width: 60%; background: #c9c5bd; border-radius: 2px"></div>
              <div style="height: 4px; width: 100%; background: #e4e1db; border-radius: 2px"></div>
              <div style="height: 4px; width: 92%; background: #e4e1db; border-radius: 2px"></div>
              <div style="height: 4px; width: 96%; background: #e4e1db; border-radius: 2px"></div>
              <div style="flex: 1; background: {{ page.figure }}; border-radius: 2px; margin-top: 6px"></div>
            </div>
            <figcaption class="mono">{{ page.label }}</figcaption>
          </figure>
        </sc-for>
      </div>
    </main>
  </div>

  <footer style="height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #ffffff; border-top: 1px solid #dcd9d3">
    <span class="hint">4 ページを PNG で保存します（annual-report_p1.png …）</span>
    <button class="btn btn-primary" style="margin-left: auto">変換を開始</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const picked = [1, 2, 3, 6];
    const figures = ['#dfe6f0', '#e8e4da', '#dde8df', '#f0e2dc'];
    const pages = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => {
      const on = picked.includes(n);
      return {
        label: on ? n + '  ✓ 変換する' : String(n),
        opacity: on ? 1 : 0.45,
        border: on ? '2px solid #1e5aa8' : '1px solid #dcd9d3',
        figure: figures[n % figures.length]
      };
    });
    return { pages };
  }
}
</script>
</body>
</html>
