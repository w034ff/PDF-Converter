<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>画像から PDF：空の状態</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1e5aa8}a:hover{color:#163f78}
.btn{font:inherit;font-size:13px;border-radius:6px;padding:0 14px;min-height:36px;cursor:pointer}
.btn-primary{background:#1e5aa8;color:#fff;border:1px solid #1e5aa8;font-weight:500}
.btn-ghost{background:#fff;color:#1f1f1f;border:1px solid #cfcbc4}
.seg{display:flex;border:1px solid #cfcbc4;border-radius:6px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;min-height:34px;border:0;background:#fff;color:#1f1f1f;cursor:pointer}
.seg button[aria-pressed="true"]{background:#1e5aa8;color:#fff}
.label{font-size:13px;font-weight:500;color:#1f1f1f}
.hint{font-size:12px;color:#5c5a56}
</style>
</helmet>
<div style="min-height: 800px; display: flex; flex-direction: column; background: #f4f3f0; color: #1f1f1f; font-family: 'Noto Sans JP', system-ui, sans-serif">
  <header style="height: 48px; display: flex; align-items: center; gap: 24px; padding: 0 16px; background: #ffffff; border-bottom: 1px solid #dcd9d3">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e5aa8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
      PDF Converter
    </div>
    <nav style="display: flex; align-self: stretch" aria-label="変換の種類">
      <a href="#" aria-current="page" style="display: flex; align-items: center; padding: 0 16px; font-size: 14px; font-weight: 500; color: #1f1f1f; text-decoration: none; border-bottom: 2px solid #1e5aa8">画像 → PDF</a>
      <a href="PdfSingle.dc.html" style="display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #5c5a56; text-decoration: none">PDF → 画像</a>
    </nav>
    <div style="margin-left: auto; display: flex; gap: 8px; align-items: center">
      <label style="font-size: 13px" class="hint" for="lang">言語</label>
      <select id="lang" style="font: inherit; font-size: 13px; min-height: 32px; border: 1px solid #cfcbc4; border-radius: 6px; padding: 0 8px; background: #fff"><option>日本語</option><option>English</option></select>
      <button class="btn btn-ghost" aria-label="このアプリについて" style="width: 36px; padding: 0">i</button>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; min-height: 0">
    <aside style="flex: 1 1 280px; max-width: 300px; background: #ffffff; border-right: 1px solid #dcd9d3; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="label">出力</span>
        <div class="seg" role="group" aria-label="出力">
          <button aria-pressed="true">1 つの PDF</button>
          <button aria-pressed="false">1 枚ずつ</button>
        </div>
        <span class="hint">並べた順に 1 ページずつ入れて、1 つの PDF にします</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="label">ページの大きさ</span>
        <div class="seg" role="group" aria-label="ページの大きさ">
          <button aria-pressed="true">画像に合わせる</button>
          <button aria-pressed="false">A4</button>
        </div>
        <span class="hint">画像の大きさのページにします。画質は変わりません</span>
      </div>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; padding: 24px; box-sizing: border-box">
      <div style="flex: 1; border: 2px dashed #b9b5ad; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #faf9f7; padding: 32px">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5c5a56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
        <p style="margin: 0; font-size: 18px; font-weight: 700">画像をここにドロップ</p>
        <p class="hint" style="margin: 0">PNG、JPEG、WebP、BMP に対応。フォルダをドロップすると、中の画像をまとめて追加します</p>
        <div style="display: flex; gap: 8px; margin-top: 8px">
          <button class="btn btn-primary">画像を追加</button>
          <button class="btn btn-ghost">フォルダを追加</button>
        </div>
      </div>
    </main>
  </div>

  <footer style="height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #ffffff; border-top: 1px solid #dcd9d3">
    <span class="hint">画像が選ばれていません</span>
    <button class="btn btn-primary" disabled style="margin-left: auto; opacity: 0.5; cursor: not-allowed">PDF を保存</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
