[workspace]
members = [
    "crates/core",
    "crates/worker",
    "src-tauri",
]
resolver = "2"

[workspace.lints.rust]
# Denied rather than forbidden so that crates/worker/src/windows_job.rs alone
# can opt in; see the reason at the top of that module.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

