[package]
name = "pdfconv-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
# Reads the input images: size, EXIF orientation and BMP pixels (design §2).
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
# Writes the PDF; JPEG bytes go in unchanged (design §2, §4.3).
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
# Reads every page of a TIFF; image reads only the first (design §2, §4.1.1).
# The features are the compressions the app reads: G3, ZSTD and WebP stay out.
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "fax", "jpeg", "lzw"] }
# Encrypts a written PDF, which krilla cannot (design §2, §4.3.1). Its defaults
# add a clock and rayon, which the app does not use.
lopdf = { version = "0.46.0", default-features = false }
# Not called directly: the feature switches the deflate backend of krilla,
# lopdf, png and tiff to zlib-rs through feature unification (design §2).
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
# The file encryption key lopdf takes from the caller comes from the OS.
getrandom = "0.4.3"
# `ErrorCode` crosses the worker pipe and the IPC as its variant name (design §6.6).
serde = { version = "1", features = ["derive"] }
# Generates the TypeScript type of `ErrorCode` for the frontend (design §2).
# src-tauri enables it; the worker needs no TypeScript types.
ts-rs = { version = "12", optional = true }

[features]
ts = ["dep:ts-rs"]

# Only examples/gen_fixtures.rs and the tests use these (design §11.1, §11.2).
[dev-dependencies]
# Checks that `ErrorCode` is written as its name (design §6.6).
serde_json = "1"
# Decompresses FlateDecode streams in tests to verify stripped metadata (design §11.2).
flate2 = "1.1.10"
# Encodes the G4 pages of the TIFF fixtures.
fax = "0.3.0"
# Compresses the LZW pages of the TIFF fixtures.
weezl = "0.2.1"
# Writes CMYK JPEGs, which image cannot, and the EXIF and JFIF density segments.
jpeg-encoder = "0.7.1"
# The standard security handler of encrypted.pdf and restricted.pdf is MD5-based.
md-5 = "0.11"
# Renders the written PDFs in the quality test (design §11.2); the app loads
# pdfium only in the worker. Same API level as crates/worker.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881"] }
# Writes the pHYs chunk, which image's PNG encoder cannot.
png = "0.18"
