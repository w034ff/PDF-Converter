[package]
name = "pdfconv-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]

# Only examples/gen_fixtures.rs and the test that checks its output use these
# (design §11.1).
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "webp"] }
# Writes CMYK JPEGs, which image cannot, and the EXIF and JFIF density segments.
jpeg-encoder = "0.7.1"
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
# The standard security handler of encrypted.pdf and restricted.pdf is MD5-based.
md-5 = "0.11"
# Writes the pHYs chunk, which image's PNG encoder cannot.
png = "0.18"
