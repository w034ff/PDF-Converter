name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Installs the version and components pinned in rust-toolchain.toml.
      - name: Setup Rust toolchain
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # The worker tests and the bundle need the pinned pdfium (design §8.1).
      - name: Fetch pdfium
        run: npm run pdfium:fetch

      - name: Code Format Check
        run: npm run format:check

      - name: Frontend Lint
        run: npm run lint

      - name: Frontend Typecheck
        run: npm run typecheck

      - name: Frontend Test
        run: npm test

      - name: Rust Format Check
        run: cargo fmt --check

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust Test
        run: cargo test --workspace --all-features

      - name: Rust Test Without Test Hooks
        run: cargo test -p pdfconv-worker --lib

      - name: Worker Performance Test (Release)
        run: cargo test -p pdfconv-worker --test worker --release performance_render_a4_150dpi

      # Both checks pin their target platforms (deny.toml, about.toml), so the
      # result does not depend on the runner OS and one runner is enough.
      - name: Install license tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: License Check
        if: runner.os == 'Linux'
        run: npm run licenses:check

      # The list includes the license files of the bundled pdfium, which the
      # "Fetch pdfium" step above unpacked.
      - name: Check third-party license list is current
        if: runner.os == 'Linux'
        run: |
          npm run licenses:generate
          status=$(git status --porcelain src/licenses)
          if [ -n "$status" ]; then
            echo "src/licenses/third-party-licenses.json is out of date. Run npm run licenses:generate and commit the result."
            echo "$status"
            exit 1
          fi
