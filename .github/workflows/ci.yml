name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Installs the version and components pinned in rust-toolchain.toml.
      - name: Setup Rust toolchain
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # The worker tests and the bundle need the pinned pdfium (design §8.1).
      - name: Fetch pdfium
        run: npm run pdfium:fetch

      - name: Code Format Check
        run: npm run format:check

      - name: Frontend Lint
        run: npm run lint

      - name: Frontend Typecheck
        run: npm run typecheck

      - name: Frontend Test
        run: npm test

      - name: Rust Format Check
        run: cargo fmt --check

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust Test
        run: cargo test --workspace --all-features --locked

      # krilla reports its own PDF/A conformance, so veraPDF checks it too
      # (design §11.2). It exits with 1 when any file fails, which fails the
      # step. Docker is on the Ubuntu runner only.
      - name: Write PDF/A samples
        if: runner.os == 'Linux'
        run: cargo run -p pdfconv-core --example write_pdfa_samples --locked -- "$RUNNER_TEMP/pdfa"

      # The image is pinned by digest because a tag can be moved to another
      # image; the digest is veraPDF 1.30.2, a release at least 7 days old
      # when it was chosen (design §9). Update it by hand. The container has no
      # network and sees the samples read-only.
      - name: Validate PDF/A samples with veraPDF
        if: runner.os == 'Linux'
        run: docker run --rm --network none -v "$RUNNER_TEMP/pdfa:/data:ro" verapdf/cli@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb -f 2b --format text /data

      # The Rust test above rewrites src/ipc/generated; the committed copy
      # must already be what it writes.
      - name: Check TypeScript bindings diff
        shell: bash
        run: |
          status=$(git status --porcelain src/ipc/generated)
          if [ -n "$status" ]; then
            echo "src/ipc/generated is out of date. Run cargo test --workspace --all-features and commit the result."
            echo "$status"
            exit 1
          fi

      - name: Rust Test Without Test Hooks
        run: cargo test -p pdfconv-worker --lib --locked

      - name: Worker Release-Only Tests
        run: cargo test -p pdfconv-worker --test worker --release --locked -- performance_render_a4_150dpi renders_a4_at_the_maximum_dpi

      # Both checks pin their target platforms (deny.toml, about.toml), so the
      # result does not depend on the runner OS and one runner is enough.
      - name: Install license tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: Layer Check
        if: runner.os == 'Linux'
        run: npm run layers:check

      - name: License Check
        if: runner.os == 'Linux'
        run: npm run licenses:check

      # The list includes the license files of the bundled pdfium, which the
      # "Fetch pdfium" step above unpacked.
      - name: Check third-party license list is current
        if: runner.os == 'Linux'
        run: |
          npm run licenses:generate
          status=$(git status --porcelain src/licenses)
          if [ -n "$status" ]; then
            echo "src/licenses/third-party-licenses.json is out of date. Run npm run licenses:generate and commit the result."
            echo "$status"
            exit 1
          fi
