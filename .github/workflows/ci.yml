name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Installs the version and components pinned in rust-toolchain.toml.
      - name: Setup Rust toolchain
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # The worker tests and the bundle need the pinned pdfium (design §8.1).
      - name: Fetch pdfium
        run: npm run pdfium:fetch

      # The bundle resources (tauri.<os>.conf.json) must exist for the app
      # crate to build, and the layout tests use the model (design §8.5, §11.1).
      - name: Fetch onnxruntime and the layout model
        run: npm run layout:fetch

      # The frontend checks run in Node and jsdom, not in the WebView the app
      # uses, and nothing in src branches on the OS, so the Linux runner gives
      # the answer for both. They stay in this job because the main ruleset
      # requires the two Test checks by name (work-plan T00; NFR-06).
      - name: Code Format Check
        if: runner.os == 'Linux'
        run: npm run format:check

      - name: Frontend Lint
        if: runner.os == 'Linux'
        run: npm run lint

      - name: Frontend Typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: Frontend Test
        if: runner.os == 'Linux'
        run: npm test

      - name: Rust Format Check
        run: cargo fmt --check

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust Test
        run: cargo test --workspace --all-features --locked

      # krilla reports its own PDF/A conformance, so veraPDF checks it too
      # (design §11.2). It exits with 1 when any file fails, which fails the
      # step. Docker is on the Ubuntu runner only.
      - name: Write PDF/A samples
        if: runner.os == 'Linux'
        run: cargo run -p pdfconv-core --example write_pdfa_samples --locked -- "$RUNNER_TEMP/pdfa"

      # The image is pinned by digest because a tag can be moved to another
      # image; the digest is veraPDF 1.30.2, a release at least 7 days old
      # when it was chosen (design §9). Update it by hand. The container has no
      # network and sees the samples read-only.
      - name: Validate PDF/A samples with veraPDF
        if: runner.os == 'Linux'
        run: docker run --rm --network none -v "$RUNNER_TEMP/pdfa:/data:ro" verapdf/cli@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb -f 2b --format text /data

      # lopdf wrote an encryption dictionary that poppler (Evince, Okular) drew
      # as broken pages on every page while pdfium and qpdf were fine, so the
      # password-protected output is also opened by tools other than the one
      # the unit tests use (design §4.3.1, §11.2). A lopdf update must not
      # bring that back unnoticed. The password is that of PASSWORD in
      # crates/core/examples/write_encrypted_samples.rs: change them together.
      - name: Write password-protected samples
        if: runner.os == 'Linux'
        run: cargo run -p pdfconv-core --example write_encrypted_samples --locked -- "$RUNNER_TEMP/encrypted"

      - name: Install PDF tools for the compatibility check
        if: runner.os == 'Linux'
        # The runner's package lists can be older than the archive, and an
        # install from a stale list fails when a version has been replaced.
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils mupdf-tools

      - name: Open password-protected samples with qpdf, poppler and mupdf
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          password='U15 pass-word!'
          cd "$RUNNER_TEMP/encrypted"

          qpdf --check --password="$password" encrypted.pdf
          if qpdf --check encrypted.pdf; then
            echo "qpdf opened encrypted.pdf without the password"
            exit 1
          fi

          # Both PDFs must draw to the same bytes on every page.
          expected_pages=$(qpdf --show-npages plain.pdf)
          rm -rf plain-poppler encrypted-poppler plain-mupdf encrypted-mupdf
          mkdir plain-poppler encrypted-poppler plain-mupdf encrypted-mupdf
          pdftoppm -r 30 -png plain.pdf plain-poppler/page
          pdftoppm -r 30 -png -upw "$password" encrypted.pdf encrypted-poppler/page
          mutool draw -r 30 -o plain-mupdf/page-%d.png plain.pdf
          mutool draw -r 30 -p "$password" -o encrypted-mupdf/page-%d.png encrypted.pdf
          for tool in poppler mupdf; do
            for kind in plain encrypted; do
              pages=$(ls "$kind-$tool" | wc -l)
              if [ "$pages" -ne "$expected_pages" ]; then
                echo "$tool drew $pages pages of the $kind PDF, expected $expected_pages"
                exit 1
              fi
            done
            for page in "plain-$tool"/*.png; do
              if ! cmp "$page" "encrypted-$tool/$(basename "$page")"; then
                echo "$tool drew $(basename "$page") of the encrypted PDF differently"
                exit 1
              fi
            done
          done

      # The Rust test above rewrites src/ipc/generated; the committed copy
      # must already be what it writes.
      - name: Check TypeScript bindings diff
        shell: bash
        run: |
          status=$(git status --porcelain src/ipc/generated)
          if [ -n "$status" ]; then
            echo "src/ipc/generated is out of date. Run cargo test --workspace --all-features and commit the result."
            echo "$status"
            exit 1
          fi

      - name: Rust Test Without Test Hooks
        run: cargo test -p pdfconv-worker --lib --locked

      - name: Worker Release-Only Tests
        run: cargo test -p pdfconv-worker --test worker --release --locked -- performance_render_a4_150dpi renders_a4_at_the_maximum_dpi

      # Both checks pin their target platforms (deny.toml, about.toml), so the
      # result does not depend on the runner OS and one runner is enough.
      - name: Install license tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: Layer Check
        if: runner.os == 'Linux'
        run: npm run layers:check

      - name: License Check
        if: runner.os == 'Linux'
        run: npm run licenses:check

      # The list includes the license files of the bundled pdfium and
      # onnxruntime, which the "Fetch pdfium" and "Fetch onnxruntime and the
      # layout model" steps above unpacked, and the files of the layout model
      # in scripts/layout-model.
      - name: Check third-party license list is current
        if: runner.os == 'Linux'
        run: |
          npm run licenses:generate
          status=$(git status --porcelain src/licenses)
          if [ -n "$status" ]; then
            echo "src/licenses/third-party-licenses.json is out of date. Run npm run licenses:generate and commit the result."
            echo "$status"
            exit 1
          fi
