name: Release

# A `v*` tag builds the four installers and attaches them to a draft
# Release (work-plan T15, requirements NFR-04). The owner reviews the draft
# and publishes it by hand.
#
# Only the last job can write to the repository. The checks and the builds
# run third-party actions and the dependencies' build code (build.rs, npm
# packages), so they get a read-only token; the job that creates the draft
# runs nothing but the GitHub CLI. The draft is made only after every check
# and both builds have passed, so a failure leaves no draft behind.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history, to tell whether the tag is on main.
          fetch-depth: 0
          persist-credentials: false

      # Only reviewed code is released: main accepts changes only through
      # pull requests that passed CI on both OSes.
      - name: Verify the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Verify version matches tag
        run: node scripts/check-release-version.ts "$GITHUB_REF_NAME"

      # Installs the version pinned in rust-toolchain.toml.
      - name: Setup Rust toolchain
        run: rustup toolchain install

      - name: Install npm dependencies
        run: npm ci

      # The license list includes the bundled pdfium's license files.
      - name: Fetch pdfium
        run: npm run pdfium:fetch

      - name: Install license tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: License check
        run: npm run licenses:check

      - name: Check third-party license list is current
        run: |
          npm run licenses:generate
          status=$(git status --porcelain src/licenses)
          if [ -n "$status" ]; then
            echo "src/licenses/third-party-licenses.json is out of date. Run npm run licenses:generate and commit the result."
            echo "$status"
            exit 1
          fi

      # A release must not ship a dependency with a known vulnerability, even
      # if the weekly audit has not run since the advisory was published.
      - name: Advisory check
        run: |
          cargo deny check advisories
          npm audit --omit=dev

  build:
    name: Build (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 keeps the AppImage and .deb runnable on the oldest Ubuntu
        # the requirements support (requirements §4).
        os: [windows-latest, ubuntu-22.04]

    # The same steps as bundle-check.yml, whose installers were tried on
    # real machines (T01). No build cache: a release is built from scratch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Installs the version pinned in rust-toolchain.toml.
      - name: Setup Rust toolchain
        run: rustup toolchain install

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch pdfium
        run: npm run pdfium:fetch

      # `tauri build` runs cargo without --locked; fail here instead of letting it
      # resolve versions that differ from the reviewed Cargo.lock.
      - name: Verify Cargo.lock is current
        run: cargo fetch --locked

      - name: Build installers
        run: npm run tauri build

      - name: Keep installers for the release job
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  draft:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true

      # One of each format, so a build that silently skipped a bundle does
      # not make a release without it. upload-artifact keeps the folders
      # below target/release/bundle, so each installer is one level down
      # (installers/msi/, installers/nsis/, ...).
      - name: Verify all four installers are present
        run: |
          shopt -s nullglob
          for pattern in "*.msi" "*-setup.exe" "*.AppImage" "*.deb"; do
            matches=(installers/*/$pattern)
            if [ ${#matches[@]} -ne 1 ]; then
              echo "Expected one $pattern, found ${#matches[@]}."
              ls -lR installers
              exit 1
            fi
          done

      - name: Create draft and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          extra_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" installers/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "PDF Converter $GITHUB_REF_NAME" \
            --verify-tag \
            "${extra_args[@]}"
